name: Economy
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  accounting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.lock -e .
      - run: python -m pip check
      - run: python -m pytest -q --junitxml=report.xml
