[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "widemind"
version = "0.3.0"
description = "WideMind runtime economy, payments and owner-operated tools"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "cryptography>=50,<51"]

[project.optional-dependencies]
browser = ["playwright>=1.50,<2"]
graphics = ["Pillow>=13,<14"]
test = ["pytest>=8.3,<10"]

[project.scripts]
widemind = "widemind.cli:main"
widemind-economy = "widemind.economy.cli:main"

[project.urls]
Repository = "https://github.com/antonikzpriv-png/Widemind"

[tool.setuptools.packages.find]
where = ["src"]
include = ["widemind*"]

[tool.setuptools.package-data]
"widemind.economy" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
