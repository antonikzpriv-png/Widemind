[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "widemind"
version = "0.3.0"
description = "WideMind's independently enforced economy and payment service"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1"]

[project.optional-dependencies]
test = ["pytest>=8.3,<10"]

[project.scripts]
widemind-economy = "widemind.economy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["widemind*"]

[tool.setuptools.package-data]
"widemind.economy" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
