<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; form-action 'none'; base-uri 'none'"><title>Harbor Studio project estimator</title><style>:root{color-scheme:light;font-family:system-ui,sans-serif;color:#17251f;background:#eef2ee}*{box-sizing:border-box}body{margin:0;padding:clamp(16px,5vw,48px)}main{max-width:840px;margin:auto;background:white;border:1px solid #d8e1d9;border-radius:20px;padding:clamp(20px,5vw,44px)}h1{font-size:clamp(28px,5vw,42px);line-height:1.1;letter-spacing:-.04em;margin:8px 0 16px}p{line-height:1.6;color:#4c5f52}form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:18px;margin-top:24px}label{display:grid;gap:8px;font-size:14px}input{width:100%;font:inherit;padding:13px;border:1px solid #809889;border-radius:8px;background:#fff;color:#17251f}.controls{grid-column:1/-1;display:flex;gap:12px;flex-wrap:wrap}button{font:600 14px system-ui;min-height:44px;padding:12px 20px;border-radius:8px;border:1px solid #647a6b;background:#b6ddd8;color:#10251a;cursor:pointer}button[type=reset]{background:#fff}.outputs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:16px;margin-top:28px}.output{padding:20px;background:#f0f5f0;border-radius:12px;min-width:0}.output span{display:block;color:#47604e;font-size:13px}.output output{display:block;font-size:30px;line-height:1.4;overflow-wrap:anywhere;margin-top:8px}#calculator-status{font-size:13px;min-height:40px}#calculator-status[data-state=error]{color:#992b20}:focus-visible{outline:3px solid #293d30;outline-offset:3px}footer{margin-top:24px;border-top:1px solid #d8e1d9;padding-top:15px;font-size:12px;color:#65766a}
</style></head><body><main><p>YOUR CUSTOM CALCULATOR</p><h1>Price your next project</h1><p>An interactive estimator for Harbor Studio.</p><form id="calculator-form" novalidate><label for="input-hours">Project hours<input id="input-hours" name="hours" type="number" step="any" min="0" max="500" value="8" required></label><label for="input-rate">Hourly rate<input id="input-rate" name="rate" type="number" step="any" min="1" max="1000" value="60" required></label><div class="controls"><button type="submit">Calculate</button><button type="reset">Reset</button></div></form><div class="outputs"><div class="output"><span>Estimated total</span><output id="output-estimate" aria-live="polite">—</output></div></div><p id="calculator-status" role="status"></p><footer>Runs locally in your browser. No information is uploaded. Results use standard JavaScript numeric precision.</footer><noscript>This calculator needs JavaScript enabled to calculate results.</noscript></main><script>/* Customer-specific calculator source. No network, eval or dependencies. */
(function(){'use strict';
const definition={"inputs":[{"default":8,"id":"hours","label":"Project hours","max":500,"min":0},{"default":60,"id":"rate","label":"Hourly rate","max":1000,"min":1}],"outputs":[{"id":"estimate","label":"Estimated total"}]};
function calculate(values){
 if(!values||typeof values!=='object'||Array.isArray(values)||Object.keys(values).length!==definition.inputs.length)throw new Error('Provide every required input.');
 for(const field of definition.inputs){const value=values[field.id];if(!Object.hasOwn(values,field.id)||typeof value!=='number'||!Number.isFinite(value)||value<field.min||value>field.max)throw new Error(field.label+' must be a finite number from '+field.min+' to '+field.max+'.');}
 const result={"estimate": ((values["hours"])*(values["rate"]))};
 for(const value of Object.values(result)){if(!Number.isFinite(value)||Math.abs(value)>1e15)throw new Error('Calculation is undefined or outside the supported numeric range.');}
 return result;
}
const api=Object.freeze({calculate,definition});
if(typeof module!=='undefined'&&module.exports)module.exports=api;
if(typeof globalThis!=='undefined')globalThis.WideMindCalculator=api;
if(typeof document!=='undefined'){
 const form=document.getElementById('calculator-form'),status=document.getElementById('calculator-status');
 function render(){try{const values={};for(const field of definition.inputs){const input=form.elements.namedItem(field.id);if(input.value.trim()==='')throw new Error(field.label+' is required.');values[field.id]=Number(input.value);}const valuesOut=calculate(values);for(const field of definition.outputs)document.getElementById('output-'+field.id).textContent=String(Number(valuesOut[field.id].toPrecision(12)));status.textContent='Calculated successfully.';status.dataset.state='success';}catch(error){for(const field of definition.outputs)document.getElementById('output-'+field.id).textContent='—';status.textContent=error.message;status.dataset.state='error';}}
 form.addEventListener('submit',event=>{event.preventDefault();render();});form.addEventListener('input',render);form.addEventListener('reset',()=>setTimeout(render,0));render();
}
})();
</script></body></html>
